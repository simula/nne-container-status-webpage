# Development environment on macOS: conda provides Python, pip installs the project editable with its test and
# development tools; nnedbtools comes from its release tag (pyproject.toml, needs SSH access to GitHub).
# Create: conda env create -f environment.yml
name: nne-container-status-webpage
channels:
  - conda-forge
dependencies:
  - python=3.14.4
  - pip
  - pip:
      - -e ".[test,dev]"
