[project]
name = "nne-container-status-webpage"
version = "0.1.0"
description = "Web dashboard of the NNE node containers: heartbeats in report container_rawdata checked against the nne experiment setup"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = [
    "nnedbtools @ git+ssh://git@github.com/simula/nnedbtools.git@v.2026-11-06-Heartbeat-Split",
    "dash==4.5.0",
    "dash-ag-grid==35.3.0",
    "plotly==7.1.0",
    "gunicorn==26.2.0",
    "environs>=15.2.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
dev = ["black==26.10.1", "isort==9.0.2", "pylint==4.1.3"]

[project.scripts]
container-status-webpage = "container_status_webpage.app:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
container_status_webpage = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.isort]
profile = "black"
