# nginx site of the NNE container status webpage (DESIGN §11): HTTPS on port 443 → gunicorn on 127.0.0.1:8050;
# port 80 only redirects to HTTPS. Self-signed certificate (INSTALLATION.md, TLS certificate); access control is open
# (DESIGN section 12).
#   /etc/nginx/sites-available/nne-container-status-webpage, linked in sites-enabled (default site removed)
server {
    listen 80 default_server;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    ssl_certificate /etc/ssl/certs/nne-container-status-webpage.crt;
    ssl_certificate_key /etc/ssl/private/nne-container-status-webpage.key;

    location / {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
