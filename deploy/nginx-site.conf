# nginx site of the NNE container status webpage: port 80 → gunicorn on 127.0.0.1:8050 (DESIGN §11).
# HTTP only: TLS and access control are open (DESIGN section 12).
#   /etc/nginx/sites-available/nne-container-status-webpage, linked in sites-enabled (default site removed)
server {
    listen 80 default_server;

    location / {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
