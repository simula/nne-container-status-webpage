# nginx site of the NNE container status webpage (DESIGN §11): ports 80 and 443 → gunicorn on 127.0.0.1:8050.
# Browsers switch specula.proxmox.crnalab.net to HTTPS, where the self-signed certificate is not trusted; they keep
# plain HTTP for an IP address: open http://<specula IPv4>/ (INSTALLATION.md). Access control is open (DESIGN §12).
#   /etc/nginx/sites-available/nne-container-status-webpage, linked in sites-enabled (default site removed)
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_certificate /etc/ssl/certs/nne-container-status-webpage.crt;
    ssl_certificate_key /etc/ssl/private/nne-container-status-webpage.key;

    location / {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
